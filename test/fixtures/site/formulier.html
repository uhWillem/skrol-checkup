<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Contact</title>
  <link rel="icon" href="https://cdn.prod.website-files.com/img/favicon.ico">
</head>
<body>
  <h1>Contact</h1>
  <div class="w-form">
    <form id="email-form" name="email-form" data-name="Email Form">
      <label for="name">Naam</label><input type="text" name="name" id="name">
      <label for="field">Bedrijf</label><input type="text" name="Field" id="field">
      <label for="email">E-mailadres</label><input type="text" name="email" id="email">
      <label for="phone">Telefoon</label><input type="tel" name="phone" id="phone">
      <input type="submit" value="Verstuur">
    </form>
    <div class="w-form-done" style="display:none"><div>Thank you! Your submission has been received!</div></div>
    <div class="w-form-fail" style="display:none"><div>Oops! Something went wrong while submitting the form.</div></div>
  </div>
  <div class="w-form">
    <form id="nieuwsbrief" data-name="Nieuwsbrief">
      <label for="nb-email">E-mail</label><input type="email" name="E-mail nieuwsbrief" id="nb-email">
    </form>
    <div class="w-form-done" style="display:none"><div>Bedankt, je bent ingeschreven.</div></div>
    <div class="w-form-fail" style="display:none"><div>Er liep iets mis. Probeer het opnieuw.</div></div>
  </div>
</body>
</html>
